name: Daily Dark Green Commits

on:
  schedule:
    - cron: "0 0 * * *"   # Roz midnight (UTC) pe chalega
  workflow_dispatch:       # Manual run option

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set Git identity
        run: |
          git config --global user.name "Sakshi-Void"
          git config --global user.email "singhsakshi0430@gmail.com"

      - name: Generate multiple commits
        run: |
          for i in {1..10}; do
            date > commits.txt
            git add commits.txt
            git commit -m "update"
          done
          git push
